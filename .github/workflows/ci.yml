name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # Job 1: Backend Unit/Integration Tests & Executable Jars
  # ========================================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Show Gradle Version
        run: ./gradlew --version

      - name: Run Backend Tests
        run: ./gradlew clean test --no-daemon

      - name: Archive Backend Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/build/reports/tests/test/**
            services/*/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Executable BootJars
        run: ./gradlew bootJar --no-daemon

      - name: Archive Backend JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            services/*/build/libs/*.jar
          retention-days: 14

  # ========================================================
  # Job 2: Frontend Lint & Production Build
  # ========================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Frontend Tests
        working-directory: apps/web
        run: npm test

      - name: Build Production Frontend
        working-directory: apps/web
        run: npm run build

      - name: Archive Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist
          retention-days: 14

  # ========================================================
  # Job 3: Build & Publish Container Images (Matrix)
  # ========================================================
  docker-build:
    name: Docker Build & Publish
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
            is_backend: true
          - service: identity-service
            context: ./services/identity-service
            dockerfile: ./services/identity-service/Dockerfile
            is_backend: true
          - service: appointment-service
            context: ./services/appointment-service
            dockerfile: ./services/appointment-service/Dockerfile
            is_backend: true
          - service: clinical-service
            context: ./services/clinical-service
            dockerfile: ./services/clinical-service/Dockerfile
            is_backend: true
          - service: billing-service
            context: ./services/billing-service
            dockerfile: ./services/billing-service/Dockerfile
            is_backend: true
          - service: realtime-service
            context: ./services/realtime-service
            dockerfile: ./services/realtime-service/Dockerfile
            is_backend: true
          - service: notification-service
            context: ./services/notification-service
            dockerfile: ./services/notification-service/Dockerfile
            is_backend: true
          - service: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            is_backend: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Backend JAR Artifacts
        if: ${{ matrix.is_backend }}
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services

      - name: Prepare Backend Jar Directory
        if: ${{ matrix.is_backend }}
        run: |
          mkdir -p ${{ matrix.context }}/build/libs
          cp services/${{ matrix.service }}/build/libs/${{ matrix.service }}.jar ${{ matrix.context }}/build/libs/ || true

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowercase Repository & Image Name
        id: image_info
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}-${{ matrix.service }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image_info.outputs.image_name }}:sha-${{ steps.image_info.outputs.short_sha }}
            ${{ steps.image_info.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

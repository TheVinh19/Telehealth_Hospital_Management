name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # Job 1: Backend Unit/Integration Tests & Executable Jars
  # ========================================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Show Gradle Version
        run: ./gradlew --version

      - name: Run Backend Tests
        run: ./gradlew clean test --no-daemon

      - name: Archive Backend Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/build/reports/tests/test/**
            services/*/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Executable BootJars
        run: ./gradlew bootJar --no-daemon

      - name: Archive Backend JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            services/*/build/libs/*.jar
          retention-days: 14

  # ========================================================
  # Job 2: Frontend Lint & Production Build
  # ========================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Frontend Tests
        working-directory: apps/web
        run: npm test

      - name: Build Production Frontend
        working-directory: apps/web
        run: npm run build

      - name: Archive Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist
          retention-days: 14

  # ========================================================
  # Job 3: Build & Publish Container Images (Matrix)
  # ========================================================
  docker-build:
    name: Docker Build & Publish
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
            is_backend: true
          - service: identity-service
            context: ./services/identity-service
            dockerfile: ./services/identity-service/Dockerfile
            is_backend: true
          - service: appointment-service
            context: ./services/appointment-service
            dockerfile: ./services/appointment-service/Dockerfile
            is_backend: true
          - service: clinical-service
            context: ./services/clinical-service
            dockerfile: ./services/clinical-service/Dockerfile
            is_backend: true
          - service: billing-service
            context: ./services/billing-service
            dockerfile: ./services/billing-service/Dockerfile
            is_backend: true
          - service: realtime-service
            context: ./services/realtime-service
            dockerfile: ./services/realtime-service/Dockerfile
            is_backend: true
          - service: notification-service
            context: ./services/notification-service
            dockerfile: ./services/notification-service/Dockerfile
            is_backend: true
          - service: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            is_backend: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Backend JAR Artifacts
        if: ${{ matrix.is_backend }}
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services

      - name: Prepare Backend Jar Directory
        if: ${{ matrix.is_backend }}
        run: |
          # download-artifact restores the original service/build/libs tree.
          # Fail here if it is missing instead of hiding errors before Docker COPY.
          test -s '${{ matrix.context }}/build/libs/${{ matrix.service }}.jar'

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowercase Repository & Image Name
        id: image_info
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}-${{ matrix.service }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image_info.outputs.image_name }}:sha-${{ steps.image_info.outputs.short_sha }}
            ${{ steps.image_info.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy VPS
    needs: [docker-build]
    if: >-
      vars.CD_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: vps
      url: https://thevinh19.duckdns.org
    permissions:
      contents: read
    concurrency:
      group: telehealth-vps-deployment
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PATH: ${{ vars.VPS_PATH || '/home/thevinh19/telehealth' }}
    steps:
      - name: Checkout Exact Tested Commit
        uses: actions/checkout@v4

      - name: Skip Superseded Commit
        id: current
        shell: bash
        run: |
          remote_sha=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is already on this branch; skipping this deployment.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Strict SSH Connection and Configuration Bundle
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set secret VPS_HOST}" "${VPS_USER:?Set secret VPS_USER}"
          : "${VPS_SSH_KEY:?Set secret VPS_SSH_KEY}" "${VPS_KNOWN_HOSTS:?Set secret VPS_KNOWN_HOSTS}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PATH" =~ ^/(home|opt|srv)/[a-zA-Z0-9_./-]+$ && "$VPS_PATH" != *..* ]]
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/vps_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/vps_key" > /dev/null
          # Only tracked configuration/scripts; never server .env, keys or generated TURN config.
          mapfile -t files < <(find deploy/vps -maxdepth 1 -type f \
            \( -name '*.sh' -o -name 'compose*.yml' -o -name 'nginx.conf' \
            -o -name 'host-nginx.conf' -o -name 'turn-probe.py' -o -name 'README.md' \) -printf '%f\n' | sort)
          tar -C deploy/vps -czf "$RUNNER_TEMP/vps-release.tgz" -- "${files[@]}"

      - name: Upload and Roll Out Images Sequentially
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/vps_key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          incoming="$VPS_PATH/.incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p '$incoming'"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/vps-release.tgz" "$VPS_USER@$VPS_HOST:$incoming/release.tgz"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="sha-${GITHUB_SHA:0:7}"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "tar -xzf '$incoming/release.tgz' -C '$incoming' && bash '$incoming/deploy-release.sh' '$VPS_PATH' '$image_tag' '$image_prefix' '$GITHUB_RUN_NUMBER'"

      - name: Remove Runner SSH Key
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.ssh/vps_key" "$HOME/.ssh/known_hosts"

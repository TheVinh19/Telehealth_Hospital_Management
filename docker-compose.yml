version: '3.8'

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: telehealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: "identity_db:identity_user:identity_pass,appointment_db:appointment_user:appointment_pass,clinical_db:clinical_user:clinical_pass,billing_db:billing_user:billing_pass,realtime_db:realtime_user:realtime_pass,notification_db:notification_user:notification_pass"
    volumes:
      - ./infra/docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telehealth-net

  redis:
    image: redis:7-alpine
    container_name: telehealth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - telehealth-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: telehealth-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telehealth-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: telehealth-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - telehealth-net

  coturn:
    image: coturn/coturn:latest
    container_name: telehealth-coturn
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./infra/docker/coturn/turnserver.conf:/etc/turnserver.conf:ro

  # ==========================================
  # Backend Microservices
  # ==========================================
  identity-service:
    build:
      context: ./services/identity-service
    container_name: telehealth-identity-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: identity_user
      SPRING_DATASOURCE_PASSWORD: identity_pass
      JWT_SECRET: ${JWT_SECRET:-telehealth-super-secret-jwt-key-2026-min-32-chars-long!}
    ports:
      - "8081:8081"
    networks:
      - telehealth-net

  appointment-service:
    build:
      context: ./services/appointment-service
    container_name: telehealth-appointment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: appointment_user
      SPRING_DATASOURCE_PASSWORD: appointment_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      REALTIME_SERVICE_URL: http://realtime-service:8085
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-telehealth-local-internal-token-2026}
      JWT_SECRET: ${JWT_SECRET:-telehealth-super-secret-jwt-key-2026-min-32-chars-long!}
    ports:
      - "8082:8082"
    networks:
      - telehealth-net

  clinical-service:
    build:
      context: ./services/clinical-service
    container_name: telehealth-clinical-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinical_db
      SPRING_DATASOURCE_USERNAME: clinical_user
      SPRING_DATASOURCE_PASSWORD: clinical_pass
      JWT_SECRET: ${JWT_SECRET:-telehealth-super-secret-jwt-key-2026-min-32-chars-long!}
      CLINICAL_AES_KEY: ${CLINICAL_AES_KEY:-12345678901234567890123456789012}
      CLINICAL_STORAGE_DIR: /app/storage/clinical-reports
      APPOINTMENT_SERVICE_URL: http://appointment-service:8082
    volumes:
      - clinical-storage:/app/storage/clinical-reports
    ports:
      - "8083:8083"
    networks:
      - telehealth-net

  billing-service:
    build:
      context: ./services/billing-service
    container_name: telehealth-billing-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billing_db
      SPRING_DATASOURCE_USERNAME: billing_user
      SPRING_DATASOURCE_PASSWORD: billing_pass
      SPRING_RABBITMQ_HOST: rabbitmq
      APPOINTMENT_SERVICE_URL: http://appointment-service:8082
      JWT_SECRET: ${JWT_SECRET:-telehealth-super-secret-jwt-key-2026-min-32-chars-long!}
    ports:
      - "8084:8084"
    networks:
      - telehealth-net

  realtime-service:
    build:
      context: ./services/realtime-service
    container_name: telehealth-realtime-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/realtime_db
      SPRING_DATASOURCE_USERNAME: realtime_user
      SPRING_DATASOURCE_PASSWORD: realtime_pass
      REALTIME_AES_KEY: ${REALTIME_AES_KEY:-12345678901234567890123456789012}
      JWT_SECRET: ${JWT_SECRET:-telehealth-super-secret-jwt-key-2026-min-32-chars-long!}
      COTURN_HOST: coturn
      APPOINTMENT_SERVICE_URL: http://appointment-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-telehealth-local-internal-token-2026}
    ports:
      - "8085:8085"
    networks:
      - telehealth-net

  notification-service:
    build:
      context: ./services/notification-service
    container_name: telehealth-notification-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_pass
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-telehealth-super-secret-jwt-key-2026-min-32-chars-long!}
    ports:
      - "8086:8086"
    networks:
      - telehealth-net

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: telehealth-api-gateway
    restart: unless-stopped
    depends_on:
      - identity-service
      - appointment-service
      - clinical-service
      - billing-service
      - realtime-service
      - notification-service
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      APPOINTMENT_SERVICE_URL: http://appointment-service:8082
      CLINICAL_SERVICE_URL: http://clinical-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
      REALTIME_SERVICE_URL: http://realtime-service:8085
      REALTIME_WS_URL: ws://realtime-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      JWT_SECRET: ${JWT_SECRET:-telehealth-super-secret-jwt-key-2026-min-32-chars-long!}
    ports:
      - "8080:8080"
    networks:
      - telehealth-net

  # ==========================================
  # Frontend Web UI
  # ==========================================
  web:
    build:
      context: ./apps/web
    container_name: telehealth-web
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
      - "5173:80"
    networks:
      - telehealth-net

networks:
  telehealth-net:
    driver: bridge

volumes:
  pgdata:
  clinical-storage:

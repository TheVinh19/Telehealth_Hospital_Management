server:
  port: 8082

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${APPOINTMENT_DB_NAME:appointment_db}
    username: ${APPOINTMENT_DB_USER:appointment_user}
    password: ${APPOINTMENT_DB_PASSWORD:appointment_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

services:
  internal-token: ${INTERNAL_SERVICE_TOKEN:telehealth-local-internal-token-2026}
  realtime:
    url: ${REALTIME_SERVICE_URL:http://localhost:8085}

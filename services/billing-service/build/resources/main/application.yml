server:
  port: 8084

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${BILLING_DB_NAME:billing_db}
    username: ${BILLING_DB_USER:billing_user}
    password: ${BILLING_DB_PASSWORD:billing_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

services:
  appointment:
    url: ${APPOINTMENT_SERVICE_URL:http://localhost:8082}

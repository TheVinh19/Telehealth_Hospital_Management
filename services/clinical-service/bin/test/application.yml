server:
  port: 0

spring:
  application:
    name: clinical-service-test
  datasource:
    url: jdbc:h2:mem:clinical_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

clinical:
  encryption-key: test_aes_gcm_secret_key_32_bytes_length!!
  storage:
    directory: build/test-storage

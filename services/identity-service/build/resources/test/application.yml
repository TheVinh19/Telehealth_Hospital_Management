server:
  port: 0

spring:
  application:
    name: identity-service-test
  datasource:
    url: jdbc:h2:mem:identity_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test_super_secret_key_minimum_256_bits_length_1234567890
  access-token-expiration-minutes: 60

server:
  port: 0

spring:
  application:
    name: realtime-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:realtime_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test_jwt_super_secret_key_minimum_256_bits_length_12345

realtime:
  encryption-key: test_realtime_aes_gcm_secret_key_32_bytes!

webrtc:
  stun:
    url: stun:stun.l.google.com:19302
  turn:
    url: turn:localhost:3478
    username: telehealth
    credential: secret
